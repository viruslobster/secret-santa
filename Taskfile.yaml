# https://taskfile.dev

version: "3"

tasks:
  default:
    cmds:
      - task frontend
      - task backend
      - ./secret-santa

  frontend:
    cmds:
      - elm make www/HomePage.elm --output elm.js

  backend:
    cmds:
      - go build

  build:
    cmds:
      - task frontend
      - task backend
